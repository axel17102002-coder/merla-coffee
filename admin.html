<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pedidos · Merla Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin">
    <header class="admin__head">
      <div><p class="admin__eyebrow">Merla Coffee</p><h1>Pedidos por WhatsApp</h1></div>
      <button class="admin__logout" id="logout" hidden>Cerrar sesión</button>
    </header>

    <section class="login" id="login">
      <h2>Acceso privado</h2>
      <p>Ingresá la clave de administración configurada en Netlify.</p>
      <form id="login-form">
        <input id="token" type="password" autocomplete="current-password" placeholder="Clave de administración" required>
        <button>Entrar</button>
      </form>
      <p class="mensaje" id="login-message"></p>
    </section>

    <section id="panel" hidden>
      <div class="panel__bar">
        <p>Los pedidos se crean pendientes. Al aprobar, se descuenta el stock y se aplican los puntos.</p>
        <button id="reload">Actualizar</button>
      </div>
      <p class="mensaje" id="panel-message"></p>
      <div class="pedidos" id="pedidos"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
