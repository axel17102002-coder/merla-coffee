# Configuración de Cloudflare (Workers + assets estáticos) para Merla Coffee
name = "merla-coffee"
main = "src/worker.js"
compatibility_date = "2026-01-01"
# nodejs_compat habilita node:crypto y process.env en el backend
compatibility_flags = ["nodejs_compat"]

# Conservar las variables/secretos cargados en el panel de Cloudflare
# (sin esto, cada deploy desde Git los borra)
keep_vars = true

[vars]
# La URL del proyecto de Supabase no es secreta; las claves sí, y van como
# Secrets en el panel: SUPABASE_SECRET_KEY y ADMIN_TOKEN
SUPABASE_URL = "https://goldreguogjsfpmkuiua.supabase.co"
# Remitente de los mails desde el dominio propio (autenticado en Brevo con
# DKIM y DMARC el 15/11/2026). Vacío = salen desde MAIL_REMITENTE (Gmail).
# Si Brevo lo rechazara, cada mail se reintenta solo desde MAIL_REMITENTE.
MAIL_REMITENTE_DOMINIO = "hola@merlacoffee.com.ar"
# Cupón de regalo en el mail de carrito abandonado. Vacío = el mail sale sin
# cupón. Para activarlo: crear el cupón en /admin → Cupones y poner acá su código.
CUPON_CARRITO = ""

[assets]
directory = "public"
binding = "ASSETS"
# Los archivos estáticos se sirven sin pasar por el Worker (más rápido y no
# cuenta en el límite de pedidos). Estas páginas sí pasan primero por él, para
# que www y workers.dev puedan redirigir al dominio (backend/lib/dominio.js).
# Solo páginas: imágenes, CSS y JS siguen saliendo directo.
run_worker_first = ["/", "/index.html", "/admin", "/admin.html", "/robots.txt", "/sitemap.xml"]

# Tarea programada, cada hora: concilia pagos con Mercado Pago, manda el
# recordatorio de carrito abandonado y borra los pendientes de más de 48 h.
# La lógica está en el handler `scheduled` de src/worker.js.
[triggers]
crons = ["0 * * * *"]
