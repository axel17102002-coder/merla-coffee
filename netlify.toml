# Configuración de Netlify para Merla Coffee
# (el hosting principal es Cloudflare Pages; esto queda por compatibilidad)

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La web llama a /api/<funcion> en cualquier hosting; acá se traduce a Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
